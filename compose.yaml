services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FORECAST_API_TOKEN: ${FORECAST_API_TOKEN:?Set a random token of at least 32 characters}
    volumes:
      - ./artifacts/energy:/models:ro
      - forecast-state:/state
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
volumes:
  forecast-state:
